plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.tth05'
version = providers.gradleProperty('scnetVersion').getOrElse('2.0.0-SNAPSHOT')

def junitVersion = '6.1.3'
def annotationsVersion = '26.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.jetbrains:annotations:${annotationsVersion}"
    testCompileOnly "org.jetbrains:annotations:${annotationsVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
